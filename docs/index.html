<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alagna Snow">
<meta name="snowcast-repo" content="jack15232/snowtracker">
<title>Alagna Snow</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9; --surface:#fcfcfb; --surface-2:#eef0f3; --line:#dfe2e7;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7a7974;
  --snow:#2a78d6; --snow-range:#b7d3f6; --snow-range-strong:#86b6ef;
  --fl:#eb6834; --fl-range:rgba(235,104,52,.18);
  --good:#0ca30c; --warn:#b77b00; --serious:#d4582a; --critical:#d03b3b;
  --good-bg:rgba(12,163,12,.12); --warn-bg:rgba(250,178,25,.2); --serious-bg:rgba(236,131,90,.2);
  --accent-ink:#fff;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#11151c; --surface:#1a1f27; --surface-2:#232a34; --line:#2e3642;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85;
  --snow:#3987e5; --snow-range:#1c3f6b; --snow-range-strong:#256abf;
  --fl:#e8743f; --fl-range:rgba(232,116,63,.22);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#e66767;
  --good-bg:rgba(12,163,12,.2); --warn-bg:rgba(250,178,25,.18); --serious-bg:rgba(236,131,90,.2);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
header h1{font-size:24px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--text-2);font-size:13px;margin-top:2px}
header .grow{flex:1;min-width:0}
#refresh{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
#refresh svg{width:22px;height:22px}
#refresh.spin svg{animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13.5px;display:none;gap:8px;align-items:flex-start}
.banner.show{display:flex}
.banner.warn{background:var(--warn-bg)}
.banner.bad{background:var(--serious-bg)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--text-2);font-family:inherit;font-weight:600;font-size:13px;line-height:1;padding:9px 0;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.card h2 .note{text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-3)}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .num{font-size:52px;font-weight:700;line-height:.95;letter-spacing:-.02em}
.hero .num small{font-size:22px;font-weight:600;margin-left:2px}
.hero .meta{color:var(--text-2);font-size:14px;padding-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--text)}
.chip.good{background:var(--good-bg)} .chip.warn{background:var(--warn-bg)} .chip.serious{background:var(--serious-bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:52px 1fr 54px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.day:first-child{border-top:0}
.day .d{font-weight:600;font-size:14px;line-height:1.15}
.day .d small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px}
.day .v{text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.day .v small{display:block;font-weight:400;color:var(--text-3);font-size:11px}
.bar{position:relative;height:22px}
.bar .track{position:absolute;inset:10px 0;height:2px;background:var(--surface-2);border-radius:1px}
.bar .rng{position:absolute;top:5px;height:12px;border-radius:6px;background:var(--snow-range)}
.bar .iqr{position:absolute;top:5px;height:12px;border-radius:6px;background:var(--snow-range-strong)}
.bar .med{position:absolute;top:1px;width:4px;height:20px;border-radius:2px;background:var(--snow);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface)}
.detail{grid-column:1/-1;font-size:13px;color:var(--text-2);display:none;padding:2px 0 4px}
.day.open .detail{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.kv b{color:var(--text);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:8px;border-radius:4px}
.axis-note{font-size:12px;color:var(--text-3);margin-top:6px}
svg text{font-family:inherit}
.chart{position:relative;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.3;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .1s}
.tip.show{opacity:1}
.stations{display:flex;flex-direction:column;gap:10px}
.st{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.st:first-child{border-top:0;padding-top:0}
.st .name{font-weight:600}
.st .name small{color:var(--text-3);font-weight:400}
.st .hs{font-size:26px;font-weight:700;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.st .hs small{font-size:13px;font-weight:600}
.st .chg{color:var(--text-2);font-size:13px}
.st .spark{grid-column:1/-1}
.av-level{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;font-weight:800;font-size:17px;color:#111;flex:none}
.av-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.models{width:100%;border-collapse:collapse;font-size:13px}
.models td,.models th{padding:6px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.models th{font-weight:600;color:var(--text-2);border-top:0}
.models td:first-child,.models th:first-child{text-align:left}
.muted{color:var(--text-3)}
.now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:12px;padding:10px 10px 9px}
.tile .t{font-size:12px;color:var(--text-2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-size:28px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .n small{font-size:13px;font-weight:600}
.tile .c{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.cams{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.cams::-webkit-scrollbar{display:none}
.cam{flex:0 0 84%;scroll-snap-align:center;min-width:0}
.cam a{color:inherit;text-decoration:none}
.cam .img{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--text-2);padding:10px}
.cam .cap{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:6px}
.cam .cap b{font-weight:600}
.cam .cap span{color:var(--text-3);white-space:nowrap}
.btn{appearance:none;border:0;border-radius:12px;background:var(--snow);color:#fff;font-family:inherit;font-weight:600;font-size:15px;line-height:1;padding:13px 16px;min-height:44px;cursor:pointer}
.btn.small{padding:9px 12px;min-height:36px;font-size:13.5px}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
code{font:12.5px ui-monospace,Menlo,monospace;background:var(--surface-2);padding:1px 5px;border-radius:5px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,20px);max-width:92vw;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.35;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--text-3);font-size:12px;line-height:1.5;padding:4px 4px 0}
footer a{color:inherit}
.empty{padding:40px 10px;text-align:center;color:var(--text-2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="grow">
      <h1>Alagna</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <button id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>
  <div class="banner" id="banner"></div>
  <section id="now"></section>
  <div class="seg" id="bands" role="group" aria-label="Elevation"></div>
  <main id="main"><div class="empty">Loading forecast…</div></main>
  <footer id="footer"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
